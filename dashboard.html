<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>CKD/DM 收案篩檢 Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-size: 13px;
      background: #f0f4f8;
      color: #1a202c;
      min-width: 1200px;
    }

    /* ─── Header ──────────────────────────────────────────────── */
    .header {
      background: #1a5276;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    .header .sub { font-size: 11px; opacity: 0.75; margin-left: auto; }

    /* ─── Input panel ──────────────────────────────────────────── */
    .input-panel {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #d1dde8;
    }
    .source-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .source-row button {
      background: #5dade2;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .source-row button:hover { background: #2e86c1; }
    .source-row button.primary {
      background: #1a5276;
    }
    .source-row button.primary:hover { background: #154360; }
    .source-row .spacer { flex: 1; }
    .source-row label {
      font-size: 12px; color: #4a5568; cursor: pointer;
    }
    .source-row label input { vertical-align: middle; margin-right: 3px; }

    textarea#chartno-input {
      width: 100%;
      min-height: 60px;
      max-height: 200px;
      resize: vertical;
      border: 1px solid #b0c4d8;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.4;
    }
    textarea#chartno-input:focus { border-color: #1a5276; outline: none; box-shadow: 0 0 0 2px rgba(26,82,118,.15); }

    .action-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }
    button#run-btn {
      background: #1e8449;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 18px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button#run-btn:hover { background: #196f3d; }
    button#run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress {
      flex: 1;
      font-size: 12px;
      color: #4a5568;
    }
    .progress-bar {
      display: inline-block;
      width: 200px;
      height: 12px;
      background: #d6eaf8;
      border-radius: 6px;
      overflow: hidden;
      vertical-align: middle;
      margin-right: 6px;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: #1a5276;
      width: 0%;
      transition: width 0.2s;
    }

    #status {
      padding: 6px 16px;
      font-size: 12px;
      min-height: 22px;
      background: #eaf2f8;
      border-bottom: 1px solid #d5e8f3;
      color: #5d6d7e;
    }
    #status.error { color: #c0392b; background: #fdecea; }

    /* ─── Table area ─────────────────────────────────────────── */
    .table-wrap {
      padding: 0;
      overflow-x: auto;
      background: #fff;
    }
    table.dashboard {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.dashboard th, table.dashboard td {
      border: 1px solid #e2e8f0;
      padding: 5px 6px;
      vertical-align: top;
      text-align: left;
    }
    table.dashboard thead th {
      background: #d6eaf8;
      color: #1a5276;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }
    table.dashboard thead th:hover { background: #aed6f1; }
    table.dashboard thead th.sort-asc::after { content: ' ▲'; font-size: 10px; }
    table.dashboard thead th.sort-desc::after { content: ' ▼'; font-size: 10px; }

    table.dashboard tbody tr:nth-child(even) { background: #f8fafc; }
    table.dashboard tbody tr:hover { background: #eaf6ff; }
    table.dashboard tbody tr.row-error { background: #fdecea; color: #c0392b; }

    .col-chartno { font-family: monospace; font-weight: 600; }
    .col-chartno a { color: #1a5276; cursor: pointer; text-decoration: underline; }
    .col-chartno a:hover { color: #2e86c1; }

    /* date age coloring */
    .age-warn  { background: #fef5e7; }  /* > 180 days */
    .age-bad   { background: #fadbd8; }  /* > 365 days */
    .lab-abnormal { color: #c0392b; font-weight: 600; }

    .pending-mark {
      color: #d35400;
      font-weight: 600;
    }
    .prev-date {
      display: block;
      color: #888;
      font-size: 10px;
    }
    .rel-time {
      display: block;
      color: #7f8c8d;
      font-size: 10px;
    }

    /* DM 衛教 cell */
    .dm-cell {
      max-width: 200px;
      overflow: hidden;
      font-size: 11px;
    }
    .dm-cell .dm-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    .dm-cell .dm-date { color: #1a5276; font-weight: 600; }

    /* Enrollment eligibility tags */
    .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 600;
    }
    .tag-early { background: #d5f5e3; color: #1e8449; }
    .tag-pre   { background: #d6eaf8; color: #1a5276; }
    .tag-dm    { background: #fdebd0; color: #b9770e; }
    .tag-none  { color: #95a5a6; font-size: 10px; }

    /* Action buttons in row */
    .row-action {
      background: #1e8449;
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      margin: 1px 1px;
    }
    .row-action:hover { background: #196f3d; }
    .row-action.enrolled { background: #95a5a6; cursor: default; }
    .row-action.report  { background: #1a5276; }
    .row-action.report:hover { background: #154360; }

    /* tooltip-ish for long cells (used by title attr — native) */

    .empty-table {
      padding: 24px;
      text-align: center;
      color: #95a5a6;
      font-style: italic;
    }

    /* registry panel small button */
    .registry-btns { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <span>📊</span>
    <h1>CKD/DM 收案篩檢 Dashboard</h1>
    <span class="sub" id="header-sub">vhtt / vhyl ernode</span>
  </div>

  <div class="input-panel">
    <div class="source-row">
      <strong style="font-size:12px;color:#4a5568;">輸入來源：</strong>
      <button id="src-opdweb" title="從目前 opdweb 候診頁讀取病歷號">候診清單</button>
      <button id="src-manual" title="自行貼入文字 / 點選 textarea 編輯">手動輸入</button>
      <button id="src-registry" title="讀取個案管理 registry 名單">個案管理名單</button>
      <span class="spacer"></span>
      <label><input type="checkbox" id="filter-eligible" /> 只看可收案</label>
      <button id="batch-enroll" title="把所有符合條件者一次加入個案管理">批次加入</button>
    </div>
    <textarea id="chartno-input" placeholder="一行一個病歷號，或貼入門診排程表格（自動取第5欄）"></textarea>
    <div class="action-row">
      <button id="run-btn">開始篩檢</button>
      <span class="progress">
        <span class="progress-bar"><span id="progress-fill"></span></span>
        <span id="progress-text">尚未開始</span>
      </span>
    </div>
  </div>

  <div id="status"></div>

  <div class="table-wrap">
    <table class="dashboard" id="result-table">
      <thead>
        <tr>
          <th data-key="chartno">病歷號</th>
          <th data-key="name">姓名</th>
          <th data-key="recentLab">最近抽血</th>
          <th data-key="uacr">UACR</th>
          <th data-key="ekg">EKG</th>
          <th data-key="abi">ABI</th>
          <th data-key="pvr">PVR</th>
          <th data-key="fundus">眼底鏡</th>
          <th data-key="dm">DM衛教</th>
          <th data-key="sugar">Sugar</th>
          <th data-key="hba1c">HbA1c</th>
          <th data-key="egfr">eGFR</th>
          <th data-key="gfrStage">GFR分期</th>
          <th data-key="earlyCKD">Early-CKD</th>
          <th data-key="preESRD">Pre-ESRD</th>
          <th data-key="action">⚡動作</th>
        </tr>
      </thead>
      <tbody id="result-body">
        <tr><td colspan="16" class="empty-table">輸入病歷號後按「開始篩檢」</td></tr>
      </tbody>
    </table>
  </div>

  <script src="mapping.js"></script>
  <script src="patterns-computed.js"></script>
  <script src="pattern-loader.js"></script>
  <script src="lab-core.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
