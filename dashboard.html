<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>CKD/DM 收案篩檢 Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-size: 13px;
      background: #f0f4f8;
      color: #1a202c;
      min-width: 1200px;
    }

    /* ─── Header ──────────────────────────────────────────────── */
    .header {
      background: #1a5276;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    .header .sub { font-size: 11px; opacity: 0.75; }
    .header .hdr-btn {
      background: rgba(255,255,255,.15);
      color: #fff; border: 1px solid rgba(255,255,255,.35);
      border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    .header .hdr-btn:hover { background: rgba(255,255,255,.28); }
    .header #open-cxr-btn { margin-left: auto; }

    /* ─── Input panel ──────────────────────────────────────────── */
    .input-panel {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #d1dde8;
    }
    .source-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .source-row button {
      background: #5dade2;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .source-row button:hover { background: #2e86c1; }
    .source-row button.primary {
      background: #1a5276;
    }
    .source-row button.primary:hover { background: #154360; }
    .source-row .spacer { flex: 1; }
    .source-row label {
      font-size: 12px; color: #4a5568; cursor: pointer;
    }
    .source-row label input { vertical-align: middle; margin-right: 3px; }

    .progress {
      flex: 1;
      font-size: 12px;
      color: #4a5568;
    }
    .progress-bar {
      display: inline-block;
      width: 200px;
      height: 12px;
      background: #d6eaf8;
      border-radius: 6px;
      overflow: hidden;
      vertical-align: middle;
      margin-right: 6px;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: #1a5276;
      width: 0%;
      transition: width 0.2s;
    }

    #status {
      padding: 6px 16px;
      font-size: 12px;
      min-height: 22px;
      background: #eaf2f8;
      border-bottom: 1px solid #d5e8f3;
      color: #5d6d7e;
    }
    #status.error { color: #c0392b; background: #fdecea; }

    /* ─── Table area ─────────────────────────────────────────── */
    .table-wrap {
      padding: 0;
      overflow-x: auto;
      background: #fff;
    }
    table.dashboard {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.dashboard th, table.dashboard td {
      border: 1px solid #e2e8f0;
      padding: 5px 6px;
      vertical-align: top;
      text-align: left;
    }
    table.dashboard thead th {
      background: #d6eaf8;
      color: #1a5276;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }
    table.dashboard thead th:hover { background: #aed6f1; }
    table.dashboard thead th.sort-asc::after { content: ' ▲'; font-size: 10px; }
    table.dashboard thead th.sort-desc::after { content: ' ▼'; font-size: 10px; }

    table.dashboard tbody tr:nth-child(even) { background: #f8fafc; }
    table.dashboard tbody tr:hover { background: #eaf6ff; }
    table.dashboard tbody tr.row-error { background: #fdecea; color: #c0392b; }

    .col-chartno { font-family: monospace; font-weight: 600; }
    .col-chartno a { color: #1a5276; cursor: pointer; text-decoration: underline; }
    .col-chartno a:hover { color: #2e86c1; }

    /* date age coloring */
    .age-warn  { background: #fef5e7; }  /* > 180 days */
    .age-bad   { background: #fadbd8; }  /* > 365 days */
    .lab-abnormal { color: #c0392b; font-weight: 600; }

    .pending-mark {
      color: #d35400;
      font-weight: 600;
    }
    .prev-date {
      display: block;
      color: #888;
      font-size: 10px;
    }
    .rel-time {
      display: block;
      color: #7f8c8d;
      font-size: 10px;
    }

    /* DM 衛教內容 cell — 表格內直接完整顯示最近兩次有內容紀錄
       （S3：拆掉 S2 的 truncate + title tooltip，改完整兩行） */
    .dm-cell {
      max-width: 340px;
      font-size: 11px;
    }
    .dm-cell .dm-line {
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
      margin-bottom: 3px;
    }
    .dm-cell .dm-line:last-child { margin-bottom: 0; }
    .dm-cell .dm-date { color: #1a5276; font-weight: 600; }

    /* DM 天數 cell（與 DM 衛教內容欄連動：最近一筆有內容紀錄至今天數） */
    .dm-days-warn  { color: #d35400; font-weight: 600; }   /* > 180 天 橘 */
    .dm-days-bad   { color: #c0392b; font-weight: 600; }   /* > 365 天 紅 */
    .dm-days-empty { color: #95a5a6; text-align: center; background: #f4f6f7;
                     margin: -5px -6px; padding: 5px 6px; }   /* 無有效紀錄 灰底 */
    .dmdays-col, .elig-col { text-align: center; white-space: nowrap; }

    /* Early CKD / Pre-ESRD 資格 ✅ / ❌ */
    .elig-yes { color: #1e8449; font-weight: 700; }
    .elig-no  { color: #cbd3da; }

    /* Enrollment eligibility tags */
    .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 600;
    }
    .tag-dm    { background: #fdebd0; color: #b9770e; }

    /* Action buttons in row */
    .row-action {
      background: #1e8449;
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      margin: 1px 1px;
    }
    .row-action:hover { background: #196f3d; }
    .row-action.report  { background: #1a5276; }
    .row-action.report:hover { background: #154360; }

    /* tooltip-ish for long cells (used by title attr — native) */

    .empty-table {
      padding: 24px;
      text-align: center;
      color: #95a5a6;
      font-style: italic;
    }

    /* registry panel small button */
    .registry-btns { display: flex; gap: 6px; }

    /* ─── Print（沿用 cxr.html 範式：window.print() + @media print。
           chrome-extension:// CSP 禁止新視窗 document.write，見 report-viewer.js
           註解，故不另開 window，改列印目前已篩選的表格 → 自然滿足
           「篩選後可見列」需求） ───────────────────────────────────── */
    .print-head { display: none; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff; min-width: 0; font-size: 9px; }
      .header, .input-panel, #status { display: none !important; }
      .print-head { display: block; margin: 0 0 8px; }
      .print-head h1 { font-size: 15px; }
      .print-head .meta { font-size: 11px; color: #333; margin-top: 3px; }
      .table-wrap { overflow: visible; }
      table.dashboard { font-size: 8.5px; }
      table.dashboard th, table.dashboard td { padding: 3px 4px; }
      table.dashboard thead th {
        position: static; cursor: default; background: #e8eef4 !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      table.dashboard thead th.sort-asc::after,
      table.dashboard thead th.sort-desc::after { content: ''; }
      table.dashboard tbody tr:hover { background: none; }
      table.dashboard tbody tr { page-break-inside: avoid; }
      /* DM 衛教欄列印完整展開（不限寬、自動換行） */
      .dm-cell { max-width: none; }
      .dm-cell .dm-line { white-space: normal; }
      /* 動作欄（報告按鈕）列印無意義 → 隱藏整欄 */
      .action-col, th[data-key="action"] { display: none; }
      /* 顏色背景／字色在列印保留 */
      .age-warn, .age-bad, .dm-days-empty,
      .dm-days-warn, .dm-days-bad, .elig-yes, .lab-abnormal, .pending-mark {
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <span>📊</span>
    <h1>CKD/DM 收案篩檢 Dashboard</h1>
    <span class="sub" id="header-sub">vhtt / vhyl ernode</span>
    <button id="open-cxr-btn" class="hdr-btn" title="開啟健檢報告（CXR 批次翻譯）獨立視窗">🩻 健檢報告</button>
  </div>

  <div class="input-panel">
    <div class="source-row">
      <button id="print-all" title="列印目前篩選後可見的列（A4 橫印，DM 衛教完整展開）">🖨️ 全部列印</button>
      <button id="export-csv" title="匯出 CSV（UTF-8 BOM，Excel 中文不亂碼）">📄 匯出 CSV</button>
      <span class="spacer"></span>
      <label><input type="checkbox" id="filter-eligible" /> 只看可收案</label>
      <span class="progress">
        <span class="progress-bar"><span id="progress-fill"></span></span>
        <span id="progress-text">尚未開始</span>
      </span>
    </div>
  </div>

  <div id="status"></div>

  <div class="print-head">
    <h1>CKD/DM 收案篩檢</h1>
    <div class="meta" id="print-meta"></div>
  </div>

  <div class="table-wrap">
    <table class="dashboard" id="result-table">
      <thead>
        <tr>
          <th data-key="chartno">病歷號</th>
          <th data-key="name">姓名</th>
          <th data-key="recentLab">最近抽血</th>
          <th data-key="uacr">UACR</th>
          <th data-key="ekg">EKG</th>
          <th data-key="abi">ABI</th>
          <th data-key="pvr">PVR</th>
          <th data-key="fundus">眼底鏡</th>
          <th data-key="sugar">Sugar</th>
          <th data-key="hba1c">HbA1c</th>
          <th data-key="egfr">eGFR</th>
          <th data-key="gfrStage">GFR分期</th>
          <th data-key="dm">DM 衛教內容</th>
          <th data-key="dmDays">DM 天數</th>
          <th data-key="earlyCKD">Early CKD</th>
          <th data-key="preESRD">Pre-ESRD</th>
          <th data-key="action">⚡動作</th>
        </tr>
      </thead>
      <tbody id="result-body">
        <tr><td colspan="17" class="empty-table">請在 popup 貼上病歷號清單後按「DM腎病個案管理」</td></tr>
      </tbody>
    </table>
  </div>

  <script src="mapping.js"></script>
  <script src="patterns-computed.js"></script>
  <script src="pattern-loader.js"></script>
  <script src="lab-core.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
