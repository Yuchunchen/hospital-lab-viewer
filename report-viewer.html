<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>病患檢驗報告</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    #report-frame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #fff;
    }
    .toolbar {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 9999;
      display: flex;
      gap: 6px;
    }
    .toolbar button {
      background: #1a5276;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button:hover { background: #154360; }
    #empty {
      padding: 40px;
      color: #555;
    }
    @media print {
      .toolbar { display: none !important; }
      html, body { background: #fff; }
      #report-frame { height: auto; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="print-btn">🖨️ 列印</button>
  </div>
  <iframe id="report-frame" title="Patient Report"></iframe>
  <div id="empty" style="display:none;">No report found. Please generate one from the extension popup.</div>
  <script src="report-viewer.js"></script>
</body>
</html>
