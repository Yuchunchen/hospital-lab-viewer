<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Lab &amp; Image Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #f0f4f8;
      color: #1a202c;
      width: 720px;
      min-height: 200px;
    }

    /* ─── Header ──────────────────────────────────────────────── */
    .header {
      background: #1a5276;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
    .header .sub { font-size: 11px; opacity: 0.75; margin-left: auto; }
    .patterns-status {
      font-size: 10px;
      opacity: 0.8;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.12);
      white-space: nowrap;
    }
    .patterns-status:hover { background: rgba(255,255,255,0.22); }
    .patterns-status.fresh   { color: #d5f5e3; }
    .patterns-status.cached  { color: #e8f4f8; }
    .patterns-status.bundle  { color: #fadbd8; }

    /* ─── Search Bar ──────────────────────────────────────────── */
    .search-bar {
      display: flex;
      align-items: flex-start;       /* multi-line textarea grows downward */
      gap: 8px;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #d1dde8;
    }
    .search-bar label { padding-top: 8px; }
    .search-bar label { font-size: 12px; color: #4a5568; white-space: nowrap; font-weight: 500; }
    .search-bar input,
    .search-bar textarea {
      flex: 1;
      border: 1px solid #b0c4d8;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }
    .search-bar input { letter-spacing: 1px; text-transform: uppercase; font-size: 14px; }
    .search-bar textarea {
      min-height: 34px;
      max-height: 180px;
      resize: vertical;
      line-height: 1.35;
      white-space: pre;        /* preserve tabs/spaces from pasted tables */
      overflow: auto;
    }
    .search-bar input:focus,
    .search-bar textarea:focus { border-color: #1a5276; box-shadow: 0 0 0 2px rgba(26,82,118,.15); }
    .search-bar button {
      background: #1a5276;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .search-bar button:hover { background: #154360; }
    .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── Hint ───────────────────────────────────────────────── */
    #chartno-hint {
      font-size: 11px;
      color: #2e86c1;
      padding: 0 14px 6px;
      background: #fff;
      font-family: monospace;
      min-height: 18px;
    }

    /* ─── Status ─────────────────────────────────────────────── */
    #status {
      padding: 6px 14px;
      font-size: 12px;
      min-height: 24px;
    }
    #status.error   { color: #c0392b; background: #fdecea; }
    #status.loading { color: #1a5276; }

    /* ─── Results ────────────────────────────────────────────── */
    #results {
      max-height: 520px;
      overflow-y: auto;
      padding: 0 0 12px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #eaf2f8;
      border-bottom: 1px solid #d5e8f3;
      font-size: 11px;
      color: #5d6d7e;
    }
    .cache-badge { background: #d6eaf8; color: #1a5276; padding: 1px 6px; border-radius: 9px; font-weight: 600; }
    .fresh-badge { background: #d5f5e3; color: #1e8449; padding: 1px 6px; border-radius: 9px; font-weight: 600; }
    .btn-small {
      background: none;
      border: 1px solid #aab7c4;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 11px;
      cursor: pointer;
      color: #1a5276;
    }
    .btn-small:hover { background: #d6eaf8; }
    .total-note { color: #7f8c8d; font-size: 11px; }

    /* ─── Print Report button ────────────────────────────── */
    .btn-print {
      background: #1e8449;
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 2px 9px;
      font-size: 11px;
      cursor: pointer;
      margin-left: auto;
    }
    .btn-print:hover { background: #196f3d; }
    .btn-print-bw { background: #555; }
    .btn-print-bw:hover { background: #333; }
    .btn-debug {
      background: none;
      color: #999;
      border: 1px solid #ccc;
      font-size: 10px;
      padding: 1px 5px;
    }
    .btn-debug:hover { background: #f0f0f0; color: #666; }
    .page1-only-label {
      font-size: 11px;
      color: #4a5568;
      cursor: pointer;
      user-select: none;
      margin-right: 4px;
    }
    .page1-only-label input { vertical-align: middle; margin-right: 2px; cursor: pointer; }

    .chartno-display {
      padding: 5px 14px;
      font-size: 12px;
      background: #fff;
      border-bottom: 1px solid #dce8f0;
      color: #4a5568;
    }
    .chartno-display strong { font-family: monospace; font-size: 13px; color: #1a5276; }
    .period { color: #888; font-size: 11px; }

    /* ─── Sections ───────────────────────────────────────────── */
    .section { margin: 0; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      background: #d6eaf8;
      border-top: 2px solid #1a5276;
      border-bottom: 1px solid #aed6f1;
      color: #1a5276;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .count {
      margin-left: auto;
      background: #1a5276;
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 9px;
    }
    .empty { padding: 10px 14px; color: #7f8c8d; font-style: italic; }

    /* ─── Table ──────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead { position: sticky; top: 31px; z-index: 1; }
    th {
      background: #eaf2f8;
      text-align: left;
      padding: 4px 8px;
      border-bottom: 1px solid #b0c4d8;
      border-right: 1px solid #d5e8f3;
      white-space: nowrap;
      font-size: 11px;
      color: #2c3e50;
      font-weight: 600;
    }
    td {
      padding: 3px 8px;
      border-bottom: 1px solid #eaecee;
      border-right: 1px solid #f2f3f4;
      vertical-align: top;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr:hover td { background: #eaf6ff; }

    /* ─── Row states ─────────────────────────────────────────── */
    tr.pending   td { color: #7f8c8d; }
    tr.corrected td:nth-child(2) { color: #e67e22; font-weight: 600; }

    /* ─── Expandable report cells ────────────────────────────── */
    .expand-btn {
      background: none;
      border: 1px solid #aab7c4;
      border-radius: 3px;
      padding: 0 5px;
      font-size: 11px;
      cursor: pointer;
      color: #1a5276;
      margin-left: 4px;
      line-height: 1.4;
    }
    .expand-btn:hover { background: #d6eaf8; }
    .r-full {
      white-space: pre-wrap;
      display: block;
      margin-top: 4px;
      color: #2c3e50;
      max-width: 380px;
      font-size: 11px;
    }
    .hidden { display: none !important; }

    /* ─── Machine first-run modal (vhtt / vhyl) ──────────────── */
    .machine-modal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(26,82,118,.55);
      display: flex; align-items: center; justify-content: center;
    }
    .machine-box {
      background: #fff; border-radius: 8px; padding: 20px 22px;
      width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,.3);
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    .machine-box h2 { font-size: 16px; color: #1a5276; margin-bottom: 8px; }
    .machine-box p  { font-size: 12px; color: #4a5568; line-height: 1.5; margin-bottom: 14px; }
    .machine-choices, .machine-confirm .row { display: flex; gap: 10px; }
    .machine-choices button {
      flex: 1; background: #1a5276; color: #fff; border: none;
      border-radius: 5px; padding: 14px; font-size: 14px; cursor: pointer; line-height: 1.3;
    }
    .machine-choices button:hover { background: #154360; }
    .machine-confirm .row { margin-top: 12px; }
    .machine-confirm button { flex: 1; border-radius: 5px; padding: 10px; font-size: 13px; cursor: pointer; }
    .machine-confirm .ok   { background: #1e8449; color: #fff; border: none; }
    .machine-confirm .ok:hover { background: #196f3d; }
    .machine-confirm .back { background: none; border: 1px solid #b0c4d8; color: #1a5276; }
    .machine-confirm .back:hover { background: #eaf2f8; }
  </style>
</head>
<body>
  <div class="header">
    <span>🏥</span>
    <h1>Lab &amp; Image Viewer</h1>
    <span class="sub">Lab + Imaging: all</span>
    <span class="patterns-status" id="patterns-status" title="Click to force-refresh patterns from GitHub">⏳</span>
  </div>

  <div class="search-bar">
    <label for="chartno-input">Chart No.</label>
    <textarea
      id="chartno-input"
      rows="2"
      placeholder="貼上病歷號（單筆或多筆：門診排程取第5欄／逗號／換行皆可）。報告查詢=popup 內看單人報告；DM腎病個案管理／健檢報告=把清單送到獨立視窗批次處理。"
      autocomplete="off"
      spellcheck="false"
    ></textarea>
    <button id="search-btn" title="popup 內顯示單人 lab/影像報告">報告查詢</button>
    <button id="dashboard-btn" title="把清單送到 DM腎病個案管理 獨立視窗批次篩檢">📊 DM腎病個案管理</button>
    <button id="cxr-btn" title="把清單送到 健檢報告 獨立視窗批次翻譯 CXR">🩻 健檢報告</button>
  </div>
  <div id="chartno-hint"></div>

  <div id="status"></div>
  <div id="results"></div>

  <!-- First-run machine picker (vhtt/vhyl). Hidden until popup.js shows it. -->
  <div id="machine-modal" class="machine-modal hidden">
    <div class="machine-box" id="machine-box"></div>
  </div>

  <script src="mapping.js"></script>
  <script src="patterns-computed.js"></script>
  <script src="pattern-loader.js"></script>
  <script src="report.js"></script>
  <script src="lab-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
