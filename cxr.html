<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>健檢 CXR 批次翻譯</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-size: 13px;
      background: #f0f4f8;
      color: #1a202c;
      min-width: 1000px;
    }

    /* ─── Header ──────────────────────────────────────────────── */
    .header {
      background: #4a235a;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    .header .provider-badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(255,255,255,.15);
      padding: 3px 10px;
      border-radius: 10px;
    }
    .header .gear {
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      user-select: none;
      opacity: .85;
    }
    .header .gear:hover { opacity: 1; }

    /* ─── Input panel ──────────────────────────────────────────── */
    .input-panel {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #d1dde8;
    }
    .source-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .source-row button {
      background: #a569bd;
      color: #fff; border: none; border-radius: 4px;
      padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    .source-row button:hover { background: #8e44ad; }
    .source-row .spacer { flex: 1; }
    .source-row label { font-size: 12px; color: #4a5568; cursor: pointer; }
    .source-row label input { vertical-align: middle; margin-right: 3px; }

    button#print-btn {
      background: #5d6d7e; color: #fff; border: none; border-radius: 4px;
      padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    button#print-btn:hover { background: #34495e; }

    .progress { flex: 1; font-size: 12px; color: #4a5568; }
    .progress-bar {
      display: inline-block; width: 200px; height: 12px; background: #ebdef0;
      border-radius: 6px; overflow: hidden; vertical-align: middle; margin-right: 6px;
    }
    .progress-bar > span {
      display: block; height: 100%; background: #8e44ad; width: 0%; transition: width 0.2s;
    }

    #status {
      padding: 6px 16px; font-size: 12px; min-height: 22px;
      background: #f4ecf7; border-bottom: 1px solid #e8daef; color: #5d6d7e;
    }
    #status.error { color: #c0392b; background: #fdecea; }

    /* ─── Print summary header (only visible on print) ─────────── */
    .print-head { display: none; }

    /* ─── Table area ─────────────────────────────────────────── */
    .table-wrap { padding: 0; overflow-x: auto; background: #fff; }
    table.cxr { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.cxr th, table.cxr td {
      border: 1px solid #e2e8f0; padding: 6px 8px; vertical-align: top; text-align: left;
    }
    table.cxr thead th {
      background: #ebdef0; color: #4a235a; font-weight: 600; cursor: pointer;
      user-select: none; position: sticky; top: 0; z-index: 2; white-space: nowrap;
    }
    table.cxr thead th:hover { background: #d7bde2; }
    table.cxr thead th.sort-asc::after { content: ' ▲'; font-size: 10px; }
    table.cxr thead th.sort-desc::after { content: ' ▼'; font-size: 10px; }
    table.cxr tbody tr:nth-child(even) { background: #faf6fc; }
    table.cxr tbody tr:hover { background: #f4ecf7; }
    table.cxr tbody tr.row-error { background: #fdecea; color: #c0392b; }

    .col-chartno { font-family: monospace; font-weight: 600; white-space: nowrap; }
    .col-status { text-align: center; white-space: nowrap; font-weight: 600; }
    .st-abnormal { color: #c0392b; }
    .st-normal   { color: #1e8449; }
    .st-noreport { color: #b9770e; }
    .st-error    { color: #7f8c8d; }

    .summary-cell {
      max-width: 380px;
    }
    .summary-clip {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.4;
    }
    .findings-cell { max-width: 260px; }
    .finding-abn { color: #c0392b; font-weight: 600; display: block; line-height: 1.4; }
    .finding-none { color: #95a5a6; }

    .empty-table { padding: 24px; text-align: center; color: #95a5a6; font-style: italic; }

    /* ─── Settings modal ──────────────────────────────────────── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: 8px; width: 460px; max-width: 92vw;
      box-shadow: 0 10px 40px rgba(0,0,0,.25); overflow: hidden;
    }
    .modal h2 {
      background: #4a235a; color: #fff; font-size: 15px; padding: 12px 16px; font-weight: 600;
    }
    .modal-body { padding: 16px; }
    .modal-body .field { margin-bottom: 12px; }
    .modal-body label { display: block; font-size: 12px; color: #4a5568; margin-bottom: 4px; font-weight: 600; }
    .modal-body select, .modal-body input[type="text"], .modal-body input[type="password"] {
      width: 100%; padding: 6px 10px; border: 1px solid #b0c4d8; border-radius: 4px; font-size: 13px;
    }
    .modal-body .hint { font-size: 11px; color: #7f8c8d; margin-top: 3px; }
    .modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .modal-actions .spacer { flex: 1; }
    .modal-actions button {
      border: none; border-radius: 4px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    #test-btn { background: #5dade2; color: #fff; }
    #test-btn:hover { background: #2e86c1; }
    #save-btn { background: #1e8449; color: #fff; font-weight: 600; }
    #save-btn:hover { background: #196f3d; }
    #close-btn { background: #e5e8e8; color: #34495e; }
    #test-result { font-size: 12px; margin-top: 10px; white-space: pre-wrap; line-height: 1.4; }
    #test-result.ok { color: #1e8449; }
    #test-result.err { color: #c0392b; }

    /* ─── Print ──────────────────────────────────────────────── */
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { background: #fff; min-width: 0; font-size: 11px; }
      .header, .input-panel, #status, .gear, .modal-backdrop { display: none !important; }
      .print-head { display: block; margin-bottom: 10px; }
      .print-head h1 { font-size: 16px; }
      .print-head .meta { font-size: 12px; color: #333; margin-top: 4px; }
      .table-wrap { overflow: visible; }
      table.cxr thead th { position: static; background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      table.cxr tbody tr:hover { background: none; }
      /* 列印時完整顯示摘要,不 clip */
      .summary-clip { display: block; -webkit-line-clamp: unset; overflow: visible; }
      .summary-cell, .findings-cell { max-width: none; }
      .finding-abn { color: #c0392b !important; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .col-action, th.col-action { display: none; }
      table.cxr tbody tr { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🩻</span>
    <h1>健檢 CXR 批次翻譯</h1>
    <span class="provider-badge" id="provider-badge">provider: —</span>
    <span class="gear" id="gear-btn" title="LLM 設定">⚙️</span>
  </div>

  <div class="input-panel">
    <div class="source-row">
      <button id="print-btn" title="列印（完整摘要、異常紅字）">🖨️ 列印</button>
      <span class="spacer"></span>
      <label><input type="checkbox" id="filter-abnormal" /> 只看異常</label>
      <label><input type="checkbox" id="filter-noreport" /> 只看無報告</label>
      <span class="progress">
        <span class="progress-bar"><span id="progress-fill"></span></span>
        <span id="progress-text">尚未開始</span>
      </span>
    </div>
  </div>

  <div id="status"></div>

  <div class="print-head">
    <h1>健檢 CXR 報告摘要</h1>
    <div class="meta" id="print-meta"></div>
  </div>

  <div class="table-wrap">
    <table class="cxr" id="result-table">
      <thead>
        <tr>
          <th data-key="chartno">病歷號</th>
          <th data-key="name">姓名</th>
          <th data-key="cxrDate">CXR日期</th>
          <th data-key="status">狀態</th>
          <th data-key="summary">中文摘要</th>
          <th data-key="findings">異常項目</th>
        </tr>
      </thead>
      <tbody id="result-body">
        <tr><td colspan="6" class="empty-table">請在 popup 貼上病歷號清單後按「健檢報告」</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ─── Settings modal ─── -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal">
      <h2>⚙️ LLM 翻譯設定</h2>
      <div class="modal-body">
        <div class="field">
          <label for="set-provider">後端 Provider</label>
          <select id="set-provider">
            <option value="mock">Mock（不呼叫 API，假資料測試）</option>
            <option value="gemini">Gemini Flash</option>
            <option value="claude">Claude Haiku</option>
            <option value="openai">GPT-4o-mini</option>
          </select>
        </div>
        <div class="field">
          <label for="set-model">Model</label>
          <input type="text" id="set-model" placeholder="切換 provider 自動帶入預設" />
          <div class="hint" id="model-hint"></div>
        </div>
        <div class="field">
          <label for="set-apikey">API Key</label>
          <input type="password" id="set-apikey" placeholder="mock 模式可留空" autocomplete="off" />
          <div class="hint">儲存在 chrome.storage.local（本機，不同步到雲端）。</div>
        </div>
        <div class="modal-actions">
          <button id="test-btn">測試連線</button>
          <span class="spacer"></span>
          <button id="close-btn">關閉</button>
          <button id="save-btn">儲存</button>
        </div>
        <div id="test-result"></div>
      </div>
    </div>
  </div>

  <script src="mapping.js"></script>
  <script src="patterns-computed.js"></script>
  <script src="pattern-loader.js"></script>
  <script src="lab-core.js"></script>
  <script src="llm-translate.js"></script>
  <script src="cxr.js"></script>
</body>
</html>
